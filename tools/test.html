<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script>
const c = document.getElementById('c');
const gl = c.getContext('webgl2');
c.width = innerWidth; c.height = innerHeight;
document.title = gl ? 'WEBGL2 OK' : 'NO WEBGL2';
window.__READY__ = true;
function frame(t){
  gl.viewport(0,0,c.width,c.height);
  gl.clearColor(0.05+0.1*Math.sin(t*0.001), 0.15, 0.35, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
